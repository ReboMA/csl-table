    <div class="controls" style="background-color: #e2e8f0; border: 1px solid #cbd5e1;">

// === 新增：数据清洗逻辑（统一队名） ===
    function cleanTeamNames() {
        // 遍历所有赛季的每一场比赛
        for (let season in allSeasonsData) {
            allSeasonsData[season].forEach(m => {
                // 如果发现主队是“河南”或“浙江”，自动加上“队”字
                if (m.home === "河南") m.home = "河南队";
                if (m.home === "浙江") m.home = "浙江队";
                
                // 对客队做同样的检查
                if (m.away === "河南") m.away = "河南队";
                if (m.away === "浙江") m.away = "浙江队";
            });
        }
    }


    // 这是一个变量，用来存放“当前选中的赛季的比赛数据”
    let currentMatches = [];

    // === 2. 核心逻辑：计算积分榜 (使用 currentMatches) ===
    function calculateStandings(targetRound) {
        let teams = {};
        let validMatches = currentMatches.filter(m => m.round <= targetRound);

        validMatches.forEach(m => {
            if (!teams[m.home]) teams[m.home] = { name: m.home, played: 0, win: 0, draw: 0, loss: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
            if (!teams[m.away]) teams[m.away] = { name: m.away, played: 0, win: 0, draw: 0, loss: 0, gf: 0, ga: 0, gd: 0, pts: 0 };

            let homeTeam = teams[m.home];
            let awayTeam = teams[m.away];

            homeTeam.played++; awayTeam.played++;
            homeTeam.gf += m.homeScore; awayTeam.gf += m.awayScore;
            homeTeam.ga += m.awayScore; awayTeam.ga += m.homeScore;

            if (m.homeScore > m.awayScore) {
                homeTeam.win++; awayTeam.loss++; homeTeam.pts += 3;
            } else if (m.homeScore < m.awayScore) {
                homeTeam.loss++; awayTeam.win++; awayTeam.pts += 3;
            } else {
                homeTeam.draw++; awayTeam.draw++; homeTeam.pts += 1; awayTeam.pts += 1;
            }
        });

        let standings = Object.values(teams);
        standings.forEach(t => t.gd = t.gf - t.ga);
	standings.sort((a, b) => {
            // 1. 如果积分不同，积分高的排前面
            if (b.pts !== a.pts) return b.pts - a.pts;

            // 2. 如果积分相同，找出这两支球队之间的所有交锋记录
            let mutualMatches = validMatches.filter(m => 
                (m.home === a.name && m.away === b.name) || 
                (m.home === b.name && m.away === a.name)
            );

            // 3. 只有当他们在这个赛季的两次交锋全部打完后（也就是赛季末），才启用相互战绩规则
            if (mutualMatches.length === 2) {
                let aMutualPts = 0, bMutualPts = 0;
                let aMutualGD = 0, bMutualGD = 0;
                let aMutualGF = 0, bMutualGF = 0;

                mutualMatches.forEach(m => {
                    let aIsHome = m.home === a.name;
                    let aScore = aIsHome ? m.homeScore : m.awayScore;
                    let bScore = aIsHome ? m.awayScore : m.homeScore;

                    aMutualGF += aScore; bMutualGF += bScore;
                    aMutualGD += (aScore - bScore); bMutualGD += (bScore - aScore);

                    if (aScore > bScore) aMutualPts += 3;
                    else if (aScore < bScore) bMutualPts += 3;
                    else { aMutualPts += 1; bMutualPts += 1; }
                });

                // 依次比较：相互积分 -> 相互净胜球 -> 相互进球
                if (bMutualPts !== aMutualPts) return bMutualPts - aMutualPts;
                if (bMutualGD !== aMutualGD) return bMutualGD - aMutualGD;
                if (bMutualGF !== aMutualGF) return bMutualGF - aMutualGF;
            }

            // 4. 如果相互交锋还没打完（赛季中），或者相互战绩完全一样，回归常规规则：总净胜 -> 总进球
            if (b.gd !== a.gd) return b.gd - a.gd;
            return b.gf - a.gf;
        });
        return standings;
    }

    function getAllTeams() {
        let teams = new Set();
        currentMatches.forEach(m => { teams.add(m.home); teams.add(m.away); });
        return Array.from(teams);
    }

    function getTeamRankHistory(teamName) {
        let maxRound = currentMatches.length > 0 ? Math.max(...currentMatches.map(m => m.round)) : 0;
        let history = [];
        for (let i = 1; i <= maxRound; i++) {
            let standings = calculateStandings(i);
            let index = standings.findIndex(t => t.name === teamName);
            if (index !== -1) history.push(index + 1);
        }
        return history;
    }

    // === 3. 下拉框初始化与联动 ===
    // 初始化赛季下拉框
    function initSeasonSelect() {
        let seasonSelect = document.getElementById("seasonSelect");
        for (let season in allSeasonsData) {
            let option = document.createElement("option");
            option.value = season; option.text = season;
            seasonSelect.appendChild(option);
        }
        // 触发第一次的赛季切换逻辑
        changeSeason();
    }

    // 当用户切换赛季时执行的逻辑
    function changeSeason() {
        let selectedSeason = document.getElementById("seasonSelect").value;
        // 把当前赛季的数据抽出来赋值给 currentMatches
        currentMatches = allSeasonsData[selectedSeason] || [];
        
        // 既然赛季变了，轮次和球队也要重新计算
        updateSubSelects();
        
        // 重新渲染表格和图表
        renderTable();
        renderChart();
    }

    // 更新轮次和球队下拉框
    function updateSubSelects() {
        let roundSelect = document.getElementById("roundSelect");
        let teamSelect = document.getElementById("teamSelect");
        
        // 清空旧的选项
        roundSelect.innerHTML = "";
        teamSelect.innerHTML = "";

        // 如果这个赛季没数据，就直接返回
        if (currentMatches.length === 0) return;

        let maxRound = Math.max(...currentMatches.map(m => m.round));
        for (let i = 1; i <= maxRound; i++) {
            let option = document.createElement("option");
            option.value = i; option.text = `第 ${i} 轮`;
            roundSelect.appendChild(option);
        }
        roundSelect.value = maxRound; // 默认最新一轮

        let allTeams = getAllTeams();
        allTeams.forEach(team => {
            let option = document.createElement("option");
            option.value = team; option.text = team;
            teamSelect.appendChild(option);
        });
    }

    // === 4. 渲染页面内容 ===
    function renderTable() {
        if (currentMatches.length === 0) return;
        let targetRound = parseInt(document.getElementById("roundSelect").value);
        let data = calculateStandings(targetRound);
        let tbody = document.getElementById("tableBody");
        tbody.innerHTML = ""; 

        data.forEach((team, index) => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${team.name}</strong></td>
                <td>${team.played}</td>
                <td>${team.win}</td>
                <td>${team.draw}</td>
                <td>${team.loss}</td>
                <td>${team.gf}</td>
                <td>${team.ga}</td>
                <td>${team.gd}</td>
                <td><strong>${team.pts}</strong></td>
            `;
            tbody.appendChild(tr);
        });
    }

    let myChart = null;
    function renderChart() {
        if (currentMatches.length === 0) return;
        let team = document.getElementById("teamSelect").value;
        let maxRound = Math.max(...currentMatches.map(m => m.round));
        let totalTeams = getAllTeams().length;
        
        let xData = [];
        for(let i=1; i<=maxRound; i++) xData.push(`第${i}轮`);
        let yData = getTeamRankHistory(team);

        if (!myChart) {
            myChart = echarts.init(document.getElementById('trendChart'));
        }

        let option = {
            tooltip: { trigger: 'axis', formatter: function (params) { return `${params[0].name}<br/>排名: 第 <b>${params[0].data}</b> 名`; } },
            grid: { left: '5%', right: '5%', bottom: '10%', top: '10%', containLabel: true },
            xAxis: { type: 'category', data: xData, boundaryGap: false },
            yAxis: { type: 'value', inverse: true, min: 1, max: totalTeams, minInterval: 1 },
            series: [{
                name: '排名', data: yData, type: 'line',
                label: { show: true, position: 'bottom', formatter: '{c}' },
                itemStyle: { color: '#e3001b' },
                lineStyle: { width: 3 }
            }]
        };
        // 使用 true 参数，表示如果数据发生大变化（比如换赛季了），强制覆盖旧图表
        myChart.setOption(option, true);
    }

// 网页加载完成后执行
    window.onload = () => {
        // 1. 网页一加载，先进行数据清洗，统一所有队名
        cleanTeamNames(); 
        
        // 2. 然后再初始化赛季选项（引发后续的画表和画图）
        initSeasonSelect();
    };
</script>
</body>
</html>
